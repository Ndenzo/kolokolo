name: Deploy

# Push sur main → build (HTML dans dist/) → publie dist/ sur la branche production.
# Hostinger (Git classique) doit être branché sur `production` → public_html.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-promote:
    name: Build static & promote production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SCSS + HTML dist/)
        run: npm run build

      - name: Publish dist/ to production branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -euo pipefail
          TOKEN="${DEPLOY_PAT:-${GITHUB_TOKEN}}"
          SHA="$(git rev-parse --short HEAD)"
          MSG="$(git log -1 --pretty=%s)"

          DEPLOY_DIR="$(mktemp -d)"
          cp -a dist/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b production
          git add -A
          git commit -m "deploy: ${SHA} — ${MSG}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin production

          echo "Branche production = contenu de dist/ (${SHA})"
