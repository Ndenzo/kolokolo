name: Deploy

# Push sur main → build → publie le CONTENU de dist/ sur la branche `production`
# (pas un dossier nommé dist). Hostinger doit être branché sur `production` → public_html.
# Dans public_html tu dois voir index.html à la racine, pas un dossier dist/.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-promote:
    name: Build static & promote production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SCSS + HTML → dist/)
        run: npm run build

      - name: Verify index.html exists
        run: test -f dist/index.html && ls -la dist | head -30

      - name: Publish dist/ contents to production branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: dist
          clean: true
          force: true
          commit-message: 'deploy: static site from main'
